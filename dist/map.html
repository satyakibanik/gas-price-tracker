<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Center Map | Sam’s Club Fuel Prices</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=state-dropdown">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script type="module" src="map.js?v=state-dropdown"></script>
  <script defer src="price-update.js"></script>
</head>
<body>
  <main class="map-page">
    <h1>Sam’s Club Fuel Prices</h1>
    <nav class="view-tabs" aria-label="Dashboard views">
      <a href="./">Prices</a>
      <a href="map.html" aria-current="page">Map</a>
      <a href="trip.html">Plan a trip</a>
    </nav>
    <p class="price-update" id="price-update">Price update time unavailable</p>
    <form id="map-filters" class="map-filters" aria-label="Filter fuel centers">
      <label>Fuel grade
        <select id="map-grade"><option value="unleaded">Unleaded</option><option value="premium">Premium</option><option value="diesel">Diesel</option><option value="midgrade">Midgrade</option></select>
      </label>
      <label>Maximum price per gallon
        <input id="map-max" type="number" min="0" step="0.001" placeholder="Any price">
      </label>
      <details class="state-dropdown">
        <summary id="map-state-summary">States and territories</summary>
        <div id="map-states" aria-label="States and territories"></div>
      </details>
      <label class="map-check"><input id="map-today" type="checkbox"> Today’s prices only</label>
      <button type="reset">Clear filters</button>
    </form>
    <p id="map-status" role="status">Loading fuel centers…</p>
    <div id="fuel-map" aria-label="Map of Sam’s Club fuel centers" hidden></div>
  </main>
</body>
</html>
