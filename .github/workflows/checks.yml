name: PR checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dashboard and collector
        run: |
          node --input-type=module --check < dist/app.js
          python3 -m py_compile collect.py import_directory.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("dist")
          clubs = json.loads((site / "locations.json").read_text())
          history = json.loads((site / "prices.json").read_text())
          ids = {club["id"] for club in clubs}
          assert clubs and len(ids) == len(clubs)
          assert history.keys() <= ids
          assert all(
              isinstance(price, int) and price > 0
              for observations in history.values()
              for prices in observations.values()
              for price in prices.values()
          )
          PY
      - name: Test collector with saved pages
        run: python3 -B -m unittest discover -s tests
      - name: Install browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dashboard-test"
          "$RUNNER_TEMP/dashboard-test/bin/pip" install playwright
          "$RUNNER_TEMP/dashboard-test/bin/playwright" install --with-deps "${{ matrix.browser }}"
      - name: Test dashboard and search
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused -fsS http://127.0.0.1:8765/ -o /dev/null
          "$RUNNER_TEMP/dashboard-test/bin/python" tests/search_browser.py http://127.0.0.1:8765/ "${{ matrix.browser }}"
          if [ "${{ matrix.browser }}" = chromium ]; then
            "$RUNNER_TEMP/dashboard-test/bin/python" tests/dashboard_smoke.py http://127.0.0.1:8765/
          fi
