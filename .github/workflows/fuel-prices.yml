name: Fuel prices and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: fuel-prices-${{ github.event_name == 'push' && 'code' || 'collection' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      collection: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect prices
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if python3 -B collect.py --refresh; then
            exit 0
          fi
          echo "Collection failed. Retrying in five minutes."
          sleep 300
          python3 -B collect.py --refresh
      - name: Save collected history
        if: github.event_name != 'push'
        run: |
          git add dist/prices.json dist/price-update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record daily fuel prices'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for attempt in {1..12}; do
            if gh api "$endpoint" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke test deployed dashboard
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dashboard-test"
          "$RUNNER_TEMP/dashboard-test/bin/pip" install playwright
          "$RUNNER_TEMP/dashboard-test/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/dashboard-test/bin/python" tests/dashboard_smoke.py "$DASHBOARD_URL"
      - name: Report incomplete collection
        if: needs.prepare.outputs.collection == 'failure'
        run: exit 1
