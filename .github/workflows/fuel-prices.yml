name: Fuel prices and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: fuel-prices-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect prices
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if python3 -B collect.py --refresh; then
            exit 0
          fi
          echo "Collection failed. Retrying in five minutes."
          sleep 300
          python3 -B collect.py --refresh
      - name: Save collected history
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- dist/prices.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/prices.json
          git commit -m 'Record daily fuel prices'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke test deployed dashboard
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dashboard-test"
          "$RUNNER_TEMP/dashboard-test/bin/pip" install playwright
          "$RUNNER_TEMP/dashboard-test/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/dashboard-test/bin/python" tests/dashboard_smoke.py "$DASHBOARD_URL"
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
